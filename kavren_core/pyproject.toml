[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kavren-core"
version = "0.1.0"
description = "KAVREN deterministic core: spec schema, canonical JSON, templates, CSV rules"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5"]

[project.scripts]
kavren = "kavren_core.cli:main"

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
