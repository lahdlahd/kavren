[package]
name = "kavren-contract"
version = "0.1.0"
edition = "2021"
description = "KAVREN: acceptance and payment assurance for agents hiring agents (NEAR)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
